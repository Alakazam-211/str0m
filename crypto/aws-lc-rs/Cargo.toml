[package]
name = "sew-str0m-aws-lc-rs"
version = "0.6.1"
authors = ["Martin Algesten <martin@algesten.se>", "Alakazam Labs"]
description = "Fork of str0m (https://github.com/algesten/str0m) with Sew's patches. aws-lc-rs backend for sew-str0m WebRTC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alakazam-211/str0m"
homepage = "https://github.com/Alakazam-211/str0m"
readme = "README.md"
edition = "2024"

# MSRV
rust-version = "1.85.0"

# The library keeps upstream's name (str0m_aws_lc_rs); the package is renamed.
[lib]
name = "str0m_aws_lc_rs"

[dependencies]
str0m-proto = { workspace = true, features = ["dtls"] }
aws-lc-rs.workspace = true
dimpl = { workspace = true, features = ["aws-lc-rs", "rcgen"] }
time.workspace = true
