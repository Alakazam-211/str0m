[package]
name = "sew-str0m-proto"
version = "0.7.1"
authors = ["Martin Algesten <martin@algesten.se>", "Alakazam Labs"]
description = "Fork of str0m (https://github.com/algesten/str0m) with Sew's patches. Internal crate for sew-str0m. Not intended for direct use."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alakazam-211/str0m"
homepage = "https://github.com/Alakazam-211/str0m"
readme = "README.md"
edition = "2024"

# MSRV
rust-version = "1.85.0"

# The library keeps upstream's name (str0m_proto); the package is renamed.
[lib]
name = "str0m_proto"

[features]
default = ["dtls"]
dtls = ["dep:dimpl"]
openssl = ["dep:openssl"]
pii = []

# When we are running in test mode
_internal_test_exports = []

[dependencies]
# DTLS made for str0m (optional dependency for types and traits)
dimpl = { workspace = true, optional = true }

time.workspace = true
base64ct.workspace = true
subtle.workspace = true
fastrand.workspace = true
serde.workspace = true

# For openssl errors
openssl = { workspace = true, optional = true }
