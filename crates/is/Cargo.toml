[package]
name = "sew-str0m-is"
version = "0.12.1"
authors = ["Martin Algesten <martin@algesten.se>", "Thomas Eizinger <thomas@eizinger.io>", "Alakazam Labs"]
description = "Fork of str0m (https://github.com/algesten/str0m) with Sew's patches. ICE (Interactive Connectivity Establishment) in Sans-IO style"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alakazam-211/str0m"
homepage = "https://github.com/Alakazam-211/str0m"
readme = "README.md"
edition = "2024"
rust-version = "1.89.0"

# The library keeps upstream's name (is); the package is renamed.
[lib]
name = "is"

[features]
default = ["sha1"]
sha1 = ["dep:hmac", "dep:sha1_"]
pii = ["str0m-proto/pii"]
_internal_test_exports = ["str0m-proto/_internal_test_exports"]

[dependencies]
str0m-proto = { workspace = true, default-features = false }
tracing.workspace = true
serde.workspace = true
crc.workspace = true
subtle.workspace = true
hmac = { workspace = true, optional = true }
# Package rename not supported with workspace inheritance
sha1_ = { package = "sha1", version = "0.11", optional = true }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true
