[package]
name = "sew-str0m"
version = "0.25.1"
authors = ["Martin Algesten <martin@algesten.se>", "Hugo Tunius <h@tunius.se>", "Davide Bertola <dade@dadeb.it>", "Alakazam Labs"]
description = "Fork of str0m (https://github.com/algesten/str0m) with Sew's patches. WebRTC library in Sans-IO style"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alakazam-211/str0m"
homepage = "https://github.com/Alakazam-211/str0m"
readme = "README.md"
keywords = ["webrtc", "streaming", "video", "audio", "media"]
categories = ["web-programming", "multimedia", "network-programming"]
edition = "2024"
exclude = ["/cargo_deny.sh", "/deny.toml", "/run-fuzz.sh"]

# MSRV
rust-version = "1.89.0"

# Notes on OpenSSL
# - Vendored (static link source build) ensures version consistency and easier
#   to build but increases size.
# - Non-vendored (dynamic link) uses system libraries, reducing size but may
#   cause compatibility issues.
# Choose based on security and footprint needs.
# For large deployments sharing OS images, OS updates can be easier for
# security patching than updating statically linked software.

[workspace]
# This fork publishes only the crates its patches change: sew-str0m (this package) and
# sew-str0m-is (crates/is). The other str0m crates come from crates.io at the matching upstream
# release; their directories stay as upstream has them and are not workspace members here.
members = [
  "crates/is",
  "crates/_str0m_test",
]
exclude = [
  "crates/fuzz",
  "crates/proto",
  "crates/netem",
  "crypto/aws-lc-rs",
  "crypto/rust-crypto",
  "crypto/openssl",
  "crypto/apple-crypto",
  "crypto/wincrypto",
]

[workspace.dependencies]
# This fork's crates keep upstream's library names (str0m, is), so code says `str0m::…`.
str0m = { package = "sew-str0m", version = "0.25.1", path = ".", default-features = false }
is = { package = "sew-str0m-is", version = "0.12.1", path = "crates/is", default-features = false }
# Upstream's crates, from crates.io (str0m 0.25.0's releases).
str0m-proto = { version = "0.8.0", default-features = false }
str0m-netem = { version = "0.5.0" }
str0m-aws-lc-rs = { version = "0.7.0" }
str0m-rust-crypto = { version = "0.7.0" }
str0m-openssl = { version = "0.7.0" }
str0m-apple-crypto = { version = "0.7.0" }
str0m-wincrypto = { version = "0.9.0" }
_str0m_test = { path = "crates/_str0m_test" }

# Core dependencies
tracing = "0.1.37"
fastrand = "2.0.1"
sctp-proto = "0.10.8"
combine = "4.6.6"
subtle = "2.0.0"
arrayvec = "0.7.6"
serde = { version = "1.0.152", features = ["derive"] }
dimpl = { version = "0.9.0", default-features = false }
drv = { version = "0.4.3" }
time = "0.3.47"
base64ct = "1"

# Proto dependencies
openssl = "0.10.78"

# IS dependencies
crc = "3"
hmac = "0.13"
sha1 = "0.11"

# Crypto backend dependencies
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
aes-gcm = "0.11"
aes = "0.9"
ctr = "0.10"
p256 = { version = "0.14", features = ["ecdh"] }
sha2 = "0.11"
openssl-sys = "0.9.80"
libc = "0.2"
der = "0.8"
pkcs8 = { version = "0.11", features = ["pem"] }
sec1 = "0.8"
spki = "0.8"
x509-cert = { version = "0.3", default-features = false }

# Dev/test dependencies
rouille = "3.6.2"
tempfile = "3"
url = "2"
serde_json = "1.0"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "std"] }
systemstat = "0.2.2"
pcap-file = "2.0.0"
regex = "1.11.1"
rand = "0.9.0"

# The library keeps upstream's name, so code says `str0m::…`; dependents rename the package:
# `str0m = { package = "sew-str0m", version = "0.25.1" }`.
[lib]
name = "str0m"

[features]
default = ["aws-lc-rs", "examples"]
aws-lc-rs = ["dep:str0m-aws-lc-rs"]
rust-crypto = ["dep:str0m-rust-crypto"]
openssl = ["dep:str0m-openssl"]
openssl-dimpl = ["dep:str0m-openssl", "str0m-openssl/dimpl"]
wincrypto = ["dep:str0m-wincrypto"]
# Compatibility alias: wincrypto always uses dimpl + CNG.
wincrypto-dimpl = ["wincrypto"]
apple-crypto = ["dep:str0m-apple-crypto"]
vendored = ["str0m-openssl?/vendored"]
unversioned = []

# Redacts personally identifiable information (PII) from logs debug and above
pii = ["str0m-proto/pii", "is/pii"]

# The examples require TLS for the web server via rouille.
# We use rustls instead of ssl to avoid OpenSSL dependency issues on Windows.
examples = ["rouille/rustls"]

_internal_dont_use_log_stats = []
_internal_test_exports = ["str0m-proto/_internal_test_exports", "is/_internal_test_exports"]

# Derives `drv::Input` (drv's memoization cache-key plumbing) on the public
# identity types — Mid, Rid, Ssrc, Pt, SessionId, SeqNo, Direction, MediaKind,
# Frequency, Codec, CodecSpec, FormatParams, VideoOrientation, and the H265
# profile types — so downstream `#[drv::memo]` queries can take them by value.
# Off by default.
drv = ["dep:drv"]

[dependencies]
tracing.workspace = true
fastrand.workspace = true
sctp-proto.workspace = true
combine.workspace = true
subtle.workspace = true
arrayvec.workspace = true
serde.workspace = true
time.workspace = true
base64ct.workspace = true

# DTLS made for str0m (required dependency)
dimpl.workspace = true

str0m-proto = { workspace = true, features = ["dtls"] }
is.workspace = true

drv = { workspace = true, optional = true }

# Crypto providers
str0m-aws-lc-rs = { workspace = true, optional = true }
str0m-rust-crypto = { workspace = true, optional = true }
str0m-openssl = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
str0m-apple-crypto = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Windows Crypto (dimpl + CNG)
str0m-wincrypto = { workspace = true, optional = true }

[dev-dependencies]
rouille.workspace = true
str0m-rust-crypto.workspace = true
tempfile.workspace = true
url.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
systemstat.workspace = true
pcap-file.workspace = true
regex.workspace = true
rand.workspace = true

# Package rename not supported with workspace inheritance
netem = { package = "str0m-netem", version = "0.5.0" }

# dummy package that enables "_internal_test_exports"
_str0m_test = { path = "crates/_str0m_test" }

[[example]]
name = "chat"
required-features = ["examples"]

[[example]]
name = "http-post"
required-features = ["examples"]
