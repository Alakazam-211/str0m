[package]
name = "sew-str0m"
version = "0.25.0"
authors = ["Martin Algesten <martin@algesten.se>", "Hugo Tunius <h@tunius.se>", "Davide Bertola <dade@dadeb.it>", "Alakazam Labs"]
description = "Fork of str0m (https://github.com/algesten/str0m) with Sew's patches. WebRTC library in Sans-IO style"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alakazam-211/str0m"
homepage = "https://github.com/Alakazam-211/str0m"
readme = "README.md"
keywords = ["webrtc", "streaming", "video", "audio", "media"]
categories = ["web-programming", "multimedia", "network-programming"]
edition = "2024"
exclude = ["/cargo_deny.sh", "/deny.toml", "/run-fuzz.sh"]

# MSRV
rust-version = "1.85.0"

# Notes on OpenSSL
# - Vendored (static link source build) ensures version consistency and easier
#   to build but increases size.
# - Non-vendored (dynamic link) uses system libraries, reducing size but may
#   cause compatibility issues.
# Choose based on security and footprint needs.
# For large deployments sharing OS images, OS updates can be easier for
# security patching than updating statically linked software.

[workspace]
members = [
  "crates/proto",
  "crates/is",
  "crates/netem",
  "crates/_str0m_test",
  "crypto/aws-lc-rs",
  "crypto/rust-crypto",
  "crypto/openssl",
  "crypto/apple-crypto",
  "crypto/wincrypto"
]
exclude = ["crates/fuzz"]

[workspace.dependencies]
# Internal crates. The fork publishes the crates Sew's dependency graph needs, renamed with a
# `sew-` prefix and keeping upstream's library names: sew-str0m, sew-str0m-proto, sew-str0m-is
# and sew-str0m-aws-lc-rs. The other members are not published from this fork (publish = false).
str0m = { package = "sew-str0m", version = "0.25.0", path = ".", default-features = false }
str0m-proto = { package = "sew-str0m-proto", version = "0.7.1", path = "crates/proto", default-features = false }
is = { package = "sew-str0m-is", version = "0.11.2", path = "crates/is", default-features = false }
str0m-netem = { path = "crates/netem" }
str0m-aws-lc-rs = { package = "sew-str0m-aws-lc-rs", version = "0.6.1", path = "crypto/aws-lc-rs" }
str0m-rust-crypto = { version = "0.6.0", path = "crypto/rust-crypto" }
str0m-openssl = { version = "0.6.0", path = "crypto/openssl" }
str0m-apple-crypto = { version = "0.6.0", path = "crypto/apple-crypto" }
str0m-wincrypto = { version = "0.8.1", path = "crypto/wincrypto" }
_str0m_test = { path = "crates/_str0m_test" }

# Core dependencies
tracing = "0.1.37"
fastrand = "2.0.1"
sctp-proto = "0.10.5"
combine = "4.6.6"
subtle = "2.0.0"
arrayvec = "0.7.6"
serde = { version = "1.0.152", features = ["derive"] }
# The dimpl fork (https://github.com/Alakazam-211/dimpl), published as sew-dimpl.
dimpl = { package = "sew-dimpl", version = "0.7.5", default-features = false }
drv = { version = "0.4.3" }
time = "0.3"
base64ct = "1"

# Proto dependencies
openssl = "0.10.78"

# IS dependencies
crc = "3"
hmac = "0.12.1"
sha1 = "0.10"

# Crypto backend dependencies
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
aes-gcm = "0.10"
aes = "0.8"
ctr = "0.9"
p256 = { version = "0.13", features = ["ecdh"] }
sha2 = "0.10"
openssl-sys = "0.9.80"
libc = "0.2"
der = "0.7"
pkcs8 = { version = "0.10", features = ["pem"] }
sec1 = "0.7"
spki = "0.7"
x509-cert = { version = "0.2", default-features = false }

# Dev/test dependencies
rouille = "3.6.2"
tempfile = "3"
url = "2"
serde_json = "1.0"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "std"] }
systemstat = "0.2.2"
pcap-file = "2.0.0"
regex = "1.11.1"
rand = "0.9.0"

# The library keeps upstream's name, so code says `str0m::…`; dependents rename the package:
# `str0m = { package = "sew-str0m", version = "0.25.0" }`.
[lib]
name = "str0m"

# The source still names upstream's provider features (src/crypto, tests/common.rs); they are
# not features of this package.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("rust-crypto", "openssl", "openssl-dimpl", "wincrypto", "wincrypto-dimpl", "apple-crypto", "vendored"))'] }

[features]
default = ["aws-lc-rs", "examples"]
aws-lc-rs = ["dep:str0m-aws-lc-rs"]
# sew-str0m ships the aws-lc-rs provider only. Upstream's other providers (rust-crypto,
# openssl, wincrypto, apple-crypto) would each need forking to share this fork's dimpl, and Sew
# does not use them; an application can still pass its own `CryptoProvider` to `RtcConfig`.
unversioned = []

# Redacts personally identifiable information (PII) from logs debug and above
pii = ["str0m-proto/pii", "is/pii"]

# The examples require TLS for the web server via rouille.
# We use rustls instead of ssl to avoid OpenSSL dependency issues on Windows.
examples = ["rouille/rustls"]

_internal_dont_use_log_stats = []
_internal_test_exports = ["str0m-proto/_internal_test_exports", "is/_internal_test_exports"]

# Derives `drv::Input` (drv's memoization cache-key plumbing) on the public
# identity types — Mid, Rid, Ssrc, Pt, SessionId, SeqNo, Direction, MediaKind,
# Frequency, Codec, CodecSpec, FormatParams, VideoOrientation, and the H265
# profile types — so downstream `#[drv::memo]` queries can take them by value.
# Off by default.
drv = ["dep:drv"]

[dependencies]
tracing.workspace = true
fastrand.workspace = true
sctp-proto.workspace = true
combine.workspace = true
subtle.workspace = true
arrayvec.workspace = true
serde.workspace = true
time.workspace = true
base64ct.workspace = true

# DTLS made for str0m (required dependency)
dimpl.workspace = true

str0m-proto = { workspace = true, features = ["dtls"] }
is.workspace = true

drv = { workspace = true, optional = true }

# Crypto providers
str0m-aws-lc-rs = { workspace = true, optional = true }

[dev-dependencies]
rouille.workspace = true
# Path only, so not part of the published manifest.
str0m-rust-crypto = { path = "crypto/rust-crypto" }
tempfile.workspace = true
url.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
systemstat.workspace = true
pcap-file.workspace = true
regex.workspace = true
rand.workspace = true

# Package rename not supported with workspace inheritance
netem = { package = "str0m-netem", path = "crates/netem" }

# dummy package that enables "_internal_test_exports"
_str0m_test = { path = "crates/_str0m_test" }

[[example]]
name = "chat"
required-features = ["examples"]

[[example]]
name = "http-post"
required-features = ["examples"]
